server:
  port: 8090

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/yu_ai_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  ai:
    chat:

      client:
        enabled: false  # 如果你不手动创建 ChatClient 的话可以禁用自动配置


    # ==================== 模型分工 ====================
    #
    # 当前状态：DeepSeek V4 Flash（统一聊天/Agent 推理，Pro 成本高已停用） + qwen-plus（embedding + 备用）
    #
    # ┌─────────────────────┬──────────────────────┬──────────────────────────────┐
    # │ 干什么               │ 当前用哪个             │ 说明                         │
    # ├─────────────────────┼──────────────────────┼──────────────────────────────┤
    # │ 超级智能体推理(think) │ DeepSeek V4 Flash     │ @Primary Bean，ToolCallAgent │     │    │
    # │ 恋爱大师聊天         │ DeepSeek V4 Flash     │ LoveAdvisorService          │
    # │ Query 改写/扩展      │ DeepSeek V4 Flash     │ QueryRewriter/QueryExpander │
    # │ 关键词生成           │ DeepSeek V4 Flash     │ KeywordEnricher（轻量任务）│
    # │ 文本 → 向量          │ qwen-plus/embedding   │ PgVector 检索用              │
    # └─────────────────────┴──────────────────────┴──────────────────────────────┘

    openai:
      api-key: ${DEEPSEEK_API_KEY:xxxx}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash

    dashscope:
      api-key: ${DASHSCOPE_API_KEY:xxxx}
      chat:
        options:
          model: qwen-plus
      embedding:
        enabled: true
        options:
          model: text-embedding-v3

    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5:0.5b
#           model: qwen-plus

    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024

# 直接把下面这段贴在最后！
search:
  api:
    key: ${SERPAPI_KEY:xxxx}
    hello: https://serpapi.com/search

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yang.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    org.springframework.ai: DEBUG

# 对话记忆配置：每次丢给 LLM 的历史消息条数（超级智能体 manus 用，走 ChatMemoryConfig Bean）
# DeepSeek V4 Flash 上下文已足够容纳 100 条历史消息
# 想省 Token → 调到 50；想更长记忆 → 调到 200
chat-memory:
  max-recent-messages: 100

# 恋爱顾问（知心）对话记忆条数：独立于 manus，走 LoveAdvisorService 自己 new 的 FileBasedChatMemory
# 恋爱主回答每次把最近 N 条原文塞进 Prompt，是大头 token → 窗口收窄到 30 省 60%+，长期记忆靠 PgVector 补
love:
  chat-memory:
    max-recent-messages: 30

