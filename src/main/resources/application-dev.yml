server:
  port: 8090

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/yu_ai_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  ai:
    chat:

      client:
        enabled: false  # 如果你不手动创建 ChatClient 的话可以禁用自动配置


    # ==================== 双模型分工 ====================
    #
    # 当前状态：DeepSeek V4 Pro（主/Agent推理） + DeepSeek V4 Flash（快速通道） + qwen-plus（embedding + 备用）
    #
    # ┌─────────────────────┬──────────────────────┬──────────────────────────────┐
    # │ 干什么               │ 当前用哪个             │ 说明                         │
    # ├─────────────────────┼──────────────────────┼──────────────────────────────┤
    # │ 超级智能体推理(think) │ DeepSeek V4 Pro       │ @Primary Bean，ToolCallAgent │     │    │
    # │ 恋爱大师聊天         │ DeepSeek V4 Pro       │ LoveAdvisorService          │
    # │ Query 改写/扩展      │ DeepSeek V4 Flash     │ QueryRewriter/QueryExpander │
    # │ 关键词生成           │ DeepSeek V4 Flash     │ KeywordEnricher（轻量任务）│
    # │ 文本 → 向量          │ qwen-plus/embedding   │ PgVector 检索用              │
    # └─────────────────────┴──────────────────────┴──────────────────────────────┘

    openai:
      api-key: deepseek密钥
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-pro

    dashscope:
      api-key: 阿里云千问
      chat:
        options:
          model: qwen-plus
      embedding:
        enabled: true
        options:
          model: text-embedding-v3

    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5:0.5b
#           model: qwen-plus

    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024

# 直接把下面这段贴在最后！
search:
  api:
    key: 搜索密钥
    hello: https://serpapi.com/search

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yang.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    org.springframework.ai: DEBUG

# 对话记忆配置：每次丢给 LLM 的历史消息条数
# DeepSeek V4 Pro 1M 上下文 → 100 条仅占 ~2.5%，非常安全
# 想省 Token → 调到 50；想更长记忆 → 调到 200
chat-memory:
  max-recent-messages: 100

