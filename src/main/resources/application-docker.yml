server:
  port: 8090

spring:
  datasource:
    # 注意：host 写 docker-compose 里的服务名 pgvector，不是 localhost
    url: jdbc:postgresql://pgvector:5432/yu_ai_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  ai:
    chat:
      client:
        enabled: false

    # ==================== 双模型分工 ====================
    #
    # 当前状态：DeepSeek V4 Pro（主/Agent推理） + DeepSeek V4 Flash（RAG辅助） + qwen-plus（embedding）
    #
    # ┌─────────────────────┬──────────────────────┬──────────────────────────────┐
    # │ 干什么               │ 当前用哪个             │ 说明                         │
    # ├─────────────────────┼──────────────────────┼──────────────────────────────┤
    # │ 超级智能体推理(think) │ DeepSeek V4 Pro       │ @Primary Bean，ToolCallAgent │
    # │ 恋爱大师聊天         │ DeepSeek V4 Pro       │ LoveAdvisorService          │
    # │ Query 改写/扩展      │ DeepSeek V4 Flash     │ QueryRewriter/QueryExpander │
    # │ 关键词生成           │ DeepSeek V4 Flash     │ KeywordEnricher（轻量任务）│
    # │ 文本 → 向量          │ qwen-plus/embedding   │ PgVector 检索用              │
    # └─────────────────────┴──────────────────────┴──────────────────────────────┘
    #
    openai:
      api-key: ${DEEPSEEK_API_KEY:xxxx}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-pro

    dashscope:
      api-key: ${DASHSCOPE_API_KEY:xxxx}
      # dashscope 只用于 embedding，聊天已全部切换至 DeepSeek
      embedding:
        enabled: true
        options:
          model: text-embedding-v3

    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5:0.5b

    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024

search:
  api:
    key: ${SERPAPI_KEY:xxxx}
    hello: https://serpapi.com/search

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yang.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    org.springframework.ai: INFO

# 对话记忆配置
chat-memory:
  max-recent-messages: 100
