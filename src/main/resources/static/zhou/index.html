<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全国可飞 · 顶级名鸭</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh;
  background: #0a0a0a;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  overflow: hidden;
  font-family: 'PingFang SC','Microsoft YaHei',sans-serif;
}

.watermark-wall {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  opacity: 0.05;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  grid-template-rows: repeat(4, 1fr);
  animation: wallShift 30s linear infinite;
}
@keyframes wallShift { 0%{transform:rotate(0) scale(1)} 50%{transform:rotate(2deg) scale(1.05)} 100%{transform:rotate(0) scale(1)} }
.watermark-wall img { width:100%; height:100%; object-fit:cover; filter:grayscale(100%); }

.neon-strips { position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden; }
.neon-strip { position:absolute; height:1px; width:200%; animation:stripSlide 3s linear infinite; }
.ns1 { top:20%; background:linear-gradient(90deg,transparent,#ff006e,#ffbe0b,transparent); }
.ns2 { top:50%; background:linear-gradient(90deg,transparent,#3a86ff,#ff006e,transparent); animation-delay:1s; }
.ns3 { top:80%; background:linear-gradient(90deg,transparent,#ffbe0b,#ff006e,transparent); animation-delay:2s; }
@keyframes stripSlide { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }

.particles { position:fixed; inset:0; pointer-events:none; z-index:2; }
.particle { position:absolute; font-size:1.2rem; animation:fall linear infinite; }
@keyframes fall { 0%{transform:translateY(-40px) rotate(0);opacity:1} 100%{transform:translateY(105vh) rotate(540deg);opacity:0} }

.card {
  position:relative; z-index:5;
  background:rgba(0,0,0,0.7); backdrop-filter:blur(14px);
  border:1px solid rgba(255,215,0,0.4);
  border-radius:20px;
  padding:28px 22px 22px;
  max-width:380px; width:90%;
  text-align:center;
  box-shadow:0 0 40px rgba(255,0,110,0.2),0 0 80px rgba(255,190,11,0.1);
  animation:cardPulse 2s ease-in-out infinite;
}
@keyframes cardPulse { 0%,100%{box-shadow:0 0 40px rgba(255,0,110,0.2)} 50%{box-shadow:0 0 80px rgba(255,215,0,0.35)} }

.avatar-wrapper { position:relative; width:130px; height:130px; margin:0 auto 14px; }
.avatar-ring { position:absolute; inset:-8px; border-radius:50%; border:2px solid transparent; border-top-color:#ff006e; border-right-color:#ffbe0b; animation:ringSpin 2s linear infinite; }
.avatar-ring:nth-child(2) { inset:-14px; border-top-color:#3a86ff; border-left-color:#ff006e; animation-duration:3s; animation-direction:reverse; }
.avatar-spin { width:100%; height:100%; border-radius:50%; overflow:hidden; border:3px solid rgba(255,215,0,0.6); box-shadow:0 0 30px rgba(255,215,0,0.3); animation:avatarSpin 6s linear infinite; }
@keyframes ringSpin { 100%{transform:rotate(360deg)} }
@keyframes avatarSpin { 0%{transform:rotateY(0)} 50%{transform:rotateY(180deg)} 100%{transform:rotateY(360deg)} }
.avatar-spin img { width:100%; height:100%; object-fit:cover; }
.crown { position:absolute; top:-38px; left:50%; transform:translateX(-50%); z-index:3; font-size:2rem; animation:crownBounce 0.5s ease-in-out infinite alternate; filter:drop-shadow(0 0 8px rgba(255,215,0,0.5)); }
@keyframes crownBounce { from{transform:translateX(-50%) translateY(0)} to{transform:translateX(-50%) translateY(-6px)} }

.badge { display:inline-block; background:linear-gradient(90deg,#ff006e,#ffbe0b,#ff006e); background-size:200% 100%; color:#fff; font-weight:700; font-size:0.72rem; padding:4px 16px; border-radius:14px; letter-spacing:2px; animation:badgeShine 1.5s linear infinite; }
@keyframes badgeShine { 0%{background-position:0 0} 100%{background-position:200% 0} }

.name { font-size:1.6rem; font-weight:900; background:linear-gradient(90deg,#ffd700,#ffaa00,#ffd700); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin:6px 0 2px; filter:drop-shadow(0 0 10px rgba(255,215,0,0.3)); }
.title-tag { font-size:0.7rem; color:rgba(255,255,255,0.45); letter-spacing:4px; margin-bottom:14px; }

.services { display:flex; flex-direction:column; gap:4px; margin-bottom:16px; }
.service-item { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.05); border-radius:10px; padding:7px 12px; display:flex; align-items:center; gap:8px; font-size:0.74rem; color:rgba(255,255,255,0.55); transition:all 0.3s; }
.service-item:hover { border-color:rgba(255,215,0,0.3); background:rgba(255,215,0,0.04); transform:scale(1.02); }
.service-emoji { font-size:1.1rem; }

.cta { background:linear-gradient(90deg,#ff006e,#ffbe0b); color:#fff; border:none; font-size:0.85rem; font-weight:700; padding:10px 36px; border-radius:24px; cursor:pointer; letter-spacing:2px; transition:all 0.3s; box-shadow:0 4px 20px rgba(255,0,110,0.3); }
.cta:hover { transform:scale(1.06); box-shadow:0 8px 30px rgba(255,0,110,0.5); }

.footer-text { margin-top:20px; color:rgba(255,255,255,0.1); font-size:0.6rem; letter-spacing:2px; position:relative; z-index:3; }
</style>
</head>
<body>

<div class="watermark-wall" id="wall"></div>

<div class="neon-strips">
  <div class="neon-strip ns1"></div>
  <div class="neon-strip ns2"></div>
  <div class="neon-strip ns3"></div>
</div>

<div class="particles" id="particles"></div>

<div class="card">
  <div class="avatar-wrapper">
    <div class="avatar-ring"></div>
    <div class="avatar-ring"></div>
    <div class="crown">👑</div>
    <div class="avatar-spin">
      <img src="a08ea63767d9bce8e143c614f377cd95.jpg" alt="周总">
    </div>
  </div>

  <div class="badge">🏆 官方认证 · 行业标杆</div>
  <div class="name">周总 · 阿周</div>
  <div class="title-tag">全 国 可 飞 | 使 命 必 达</div>

  <div class="services">
    <div class="service-item"><span class="service-emoji">🦆</span>顶级烧鸭 · 现点现做</div>
    <div class="service-item"><span class="service-emoji">✈️</span>全国可飞 · 打飞的送餐</div>
    <div class="service-item"><span class="service-emoji">💼</span>商务鸭王 · 高端定制</div>
    <div class="service-item"><span class="service-emoji">🌍</span>全球配送 · 使命必达</div>
    <div class="service-item"><span class="service-emoji">🔥</span>好评如潮 · 回头客 99%</div>
    <div class="service-item"><span class="service-emoji">💬</span>微信：zhou19914923424</div>
    <div class="service-item"><span class="service-emoji">🐧</span>QQ：2639153109</div>
  </div>

  <button class="cta" onclick="order()">📞 立即下单</button>
</div>

<p class="footer-text">周氏鸭业 · 始于2024 · 传承经典 · 匠心之作</p>

<script>
const wall=document.getElementById('wall');
for(let i=0;i<20;i++){const c=document.createElement('img');c.src='a08ea63767d9bce8e143c614f377cd95.jpg';wall.appendChild(c)}

const particles=document.getElementById('particles');
const emojis=['🦆','✨','💰','🔥','👑','✈️','💎','🌟','🍗','🎉'];
setInterval(()=>{
  const p=document.createElement('span');
  p.className='particle';
  p.textContent=emojis[Math.floor(Math.random()*emojis.length)];
  p.style.left=Math.random()*100+'%';
  p.style.top='-40px';
  p.style.animationDuration=(Math.random()*4+3)+'s';
  particles.appendChild(p);
  setTimeout(()=>p.remove(),7000);
},500);

let count=0;
function order(){
  count++;
  const msgs=[
    '🦆 订单已收到！周总亲自起飞！','✈️ 正在打包烧鸭...','🔥 已上飞机，预计3小时送达！',
    '💼 周总正在赶来...','👑 VIP专享，鸭王已出发！',
    '🍗 周总说：这单免费，交个朋友！',
    '🌟 第'+(Math.floor(Math.random()*9999)+count)+'位幸运客户！'
  ];
  const msg=msgs[Math.floor(Math.random()*msgs.length)];
  const t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:999;background:rgba(0,0,0,0.9);color:#ffd700;padding:10px 22px;border-radius:12px;font-size:0.82rem;border:1px solid rgba(255,215,0,0.3);animation:slideUp 0.5s ease,fadeOut 0.5s 2.5s ease forwards;';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),3000);
}
const s=document.createElement('style');
s.textContent='@keyframes slideUp{from{transform:translateX(-50%) translateY(16px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}@keyframes fadeOut{to{opacity:0}}';
document.head.appendChild(s);
</script>
</body>
</html>
